name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
